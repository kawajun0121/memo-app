<!--
  個人用メモアプリ

  【起動方法】このファイルをブラウザで直接ダブルクリックして開くだけで動きます。
  ビルドやインストールは一切不要です（Node.js等も不要）。
  PWA化してあるため、http(s)で配信すればWindowsは「アプリをインストール」、
  iPhoneはSafariの「ホーム画面に追加」からアプリのように使える（詳細はREADME.md）。

  【重要】下の<script>タグは依存関係の順番に読み込まれています。
  ファイルを追加するときは、そのファイルが使う機能（依存）より後ろに置いてください。

  【キャッシュ対策】GitHub Pages・ブラウザ・iPhoneのホーム画面アプリはCSS/JSファイルを
  数分〜長時間キャッシュするため、内容を変えただけではリロードしても反映されないことがある。
  自分のファイル（src/配下）へのすべての<link>/<script>には ?v=数字 を付けており、
  中身を変更した際は下のASSET_VERSIONの数字を1つ上げること（URLが変わることで
  古いキャッシュを確実に無視させ、新しいファイルを取得させる）。
-->
<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>メモ</title>

<!-- PWA（アプリインストール）用 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f5bd5">
<link rel="icon" href="icons/favicon-32.png">
<!-- iOS Safariの「ホーム画面に追加」用（標準のmanifest対応が弱いため個別に指定） -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="メモ">

<!-- ASSET_VERSION = 9（キャッシュ対策。中身を変更したファイルがあれば数字を上げる） -->
<link rel="stylesheet" href="src/styles/base.css?v=9">
<link rel="stylesheet" href="src/styles/layout.css?v=9">
<link rel="stylesheet" href="src/styles/components.css?v=9">
</head>
<body>
<!-- ログイン状態の判定中に一瞬だけ表示される簡易ローディング表示。boot()が判定し次第すぐ置き換わる -->
<div id="app"><div class="boot-loading">読み込み中…</div></div>

<!-- 0. Firebase SDK（PC/iPhone間のデータ同期用。CDN読み込みのためビルド不要） -->

<script src="src/types/typedefs.js?v=9"></script>
